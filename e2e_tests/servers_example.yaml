# Конфигурация серверов для E2E-тестирования MCP-серверов
# Этот файл используется оркестратором (WORKFLOW.md) для параметризации тестов.
#
# Скопируйте servers_example.yaml в этот файл и отредактируйте под свои серверы:
#   cp servers_example.yaml servers.yaml
#
# Описание полей — см. servers_example.yaml

